<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 986" width="1000" height="986" role="img" aria-labelledby="t d"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="12">
  <title id="t">Clocking: two loops and two clock trees</title>
  <desc id="d">Transmit side: refclk_buf feeds tx_pll, a loop of pfd, charge_pump (100 uA), loop_filter_rc (25.31 kilohm, 1.427 pF, plus C2 0.14 pF), vco and div_n (divide by 32), with lock_detect. Its 14 GHz output goes to tx_clkgen: dcc_cml, clkbuf_cml (clk14, CML), div2_cml (clk7, CML, an ideal placeholder), cml2cmos, phase_aligner (aligns to the retimed 7 Gb/s data), then three div2_tspc giving clk3p5, clk1p75 and clk0p875 (CMOS). Receive side: rx_cdr has one loop filter (2.352 kilohm, 20 pF, plus C2 1 pF) and one vco, and two detectors. First pfd and a 400 uA charge_pump lock the frequency to the reference; lock_detect or force_lock then turns that pump off, and cdr_pd_linear tracks the data from the analog front end against clk14. Its 14 GHz output goes to rx_clkgen: dcc_cml, clkbuf_cml (clk14, CML), two div2_cml placeholders (clk7 and clk3p5, CML), cml2cmos, then two div2_tspc giving clk1p75 and clk0p875 (CMOS).</desc>

  <!-- Source of analog/PAM4SerDes/docs/img/clocking.svg: plain boxes, straight connectors, text.
       Edit this file, then run  python3 docs/diagrams/sketch.py  to redraw the hand-drawn version.
       The colours and fonts below are only for looking at this file directly; sketch.py brings
       its own. The five sources share the style block, the markers and the legend.

       Here a block's colour is the kind of signal it puts out, and a clock's label box has
       the colour of its levels: amber = CML, blue = CMOS. -->
  <style>
    text   { fill: #1f2328; }
    .title { font-size: 18px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 700; }
    .note  { fill: #57606a; }
    .cmos  { fill: #dbeafe; stroke: #1d4ed8; }  /* CMOS logic, single-ended 0 / 0.7 V */
    .cml   { fill: #ffedd5; stroke: #c2410c; }  /* CML, differential */
    .ana   { fill: #dcfce7; stroke: #15803d; }  /* analog */
    .clk   { fill: #f3e8ff; stroke: #7e22ce; }  /* clock generation */
    .mix   { fill: url(#cmos2cml); stroke: #57606a; }  /* CMOS on one side, CML on the other */
    .mixr  { fill: url(#cml2cmos); stroke: #57606a; }
    .ext   { fill: #eaeef2; stroke: #6e7781; }  /* not on the chip, or ideal glue */
    .ph    { stroke: #dc2626; stroke-width: 2; stroke-dasharray: 6 3; }  /* placeholder cell */
    .box   { fill: #ffffff; stroke: #8c959f; }  /* container: a structural block */
    .w     { fill: none; stroke: #1f2328; stroke-width: 1.5; }  /* signal */
    .wd    { fill: none; stroke: #1f2328; stroke-width: 2.5; }  /* main data path */
    .wc    { fill: none; stroke: #7e22ce; stroke-width: 1.5; }  /* clock */
    .wb    { fill: none; stroke: #15803d; stroke-width: 1.5; stroke-dasharray: 5 3; }  /* bias current */
    .mid   { text-anchor: middle; }
    .end   { text-anchor: end; }
    .warn  { fill: #b91c1c; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#1f2328"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#7e22ce"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#15803d"/></marker>
    <linearGradient id="cmos2cml"><stop offset="0.5" stop-color="#dbeafe"/><stop offset="0.5" stop-color="#ffedd5"/></linearGradient>
    <linearGradient id="cml2cmos"><stop offset="0.5" stop-color="#ffedd5"/><stop offset="0.5" stop-color="#dbeafe"/></linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="985" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="24" y="34" class="title">Clocking: two loops and two clock trees</text>
  <text x="24" y="54" class="note">Each loop makes a 14 GHz clock from a 437.5 MHz reference. Each tree divides it down for the serializer or the deserializer.</text>

  <!-- ===== 1. tx_pll ===== -->
  <rect class="box" x="140" y="70" width="836" height="172" rx="6"/>
  <text x="152" y="89"><tspan class="name">tx_pll</tspan> 437.5 MHz x 32 = 14 GHz. Type-II charge-pump loop, 21.875 MHz bandwidth.</text>

  <text x="72" y="96" class="mid">refclk_tx_p/n</text>
  <rect class="cmos" x="24" y="102" width="96" height="44" rx="4"/>
  <text x="72" y="121" class="name mid">refclk_buf</text>
  <text x="72" y="138" class="note mid">437.5 MHz</text>
  <path class="wc" marker-end="url(#ac)" d="M120,124 H176"/>

  <rect class="cmos" x="176" y="102" width="134" height="44" rx="4"/>
  <text x="243" y="121" class="name mid">pfd</text>
  <text x="243" y="138" class="note mid">ref vs fb → up, dn</text>
  <path class="w" marker-end="url(#a)" d="M310,124 H344"/>
  <rect class="ana" x="344" y="102" width="116" height="44" rx="4"/>
  <text x="402" y="121" class="name mid">charge_pump</text>
  <text x="402" y="138" class="note mid">100 µA, ideal</text>
  <path class="w" marker-end="url(#a)" d="M460,124 H684"/>
  <text x="470" y="118">vctl</text>
  <rect class="ana" x="684" y="102" width="136" height="44" rx="4"/>
  <text x="752" y="121" class="name mid">vco</text>
  <text x="752" y="138" class="note mid">14 GHz, CMOS out</text>
  <text x="824" y="118">ck</text>

  <circle cx="575" cy="124" r="3" fill="#1f2328"/>
  <path class="w" d="M575,124 V166"/>
  <rect class="ana" x="495" y="166" width="160" height="44" rx="4"/>
  <text x="575" y="185" class="name mid">loop_filter_rc</text>
  <text x="575" y="202" class="note mid">25.31 kΩ + 1.427 pF</text>
  <text x="664" y="192" class="note">+ C2 0.14 pF</text>

  <circle cx="880" cy="124" r="3" fill="#7e22ce"/>
  <path class="wc" marker-end="url(#ac)" d="M880,124 V166"/>
  <rect class="cmos" x="824" y="166" width="112" height="44" rx="4"/>
  <text x="880" y="185" class="name mid">div_n</text>
  <text x="880" y="202" class="note mid">÷ 32</text>
  <path class="wc" marker-end="url(#ac)" d="M880,210 V228 H296 V146"/>
  <text x="735" y="223" class="mid">ckfb = ck / 32</text>

  <rect class="cmos" x="176" y="166" width="106" height="44" rx="4"/>
  <text x="229" y="185" class="name mid">lock_detect</text>
  <text x="229" y="202" class="note mid">ckref vs ckfb</text>
  <path class="w" marker-end="url(#a)" d="M176,188 H100"/>
  <text x="94" y="192" class="end">tx_lock</text>

  <!-- ck goes down to the transmitter's tree -->
  <text x="96" y="277">ck: 14 GHz, single-ended CMOS (0 to 0.7 V)</text>

