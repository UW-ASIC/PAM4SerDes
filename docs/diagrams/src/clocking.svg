  <text x="558" y="429" class="note mid">from the serializer</text>

  <!-- ===== 3. rx_cdr ===== -->
  <rect class="box" x="140" y="470" width="836" height="226" rx="6"/>
  <text x="152" y="489"><tspan class="name">rx_cdr</tspan> one loop filter and one VCO, two detectors: frequency lock first, then the data.</text>

